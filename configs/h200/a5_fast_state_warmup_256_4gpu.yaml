model_name_or_path: $MODEL
trust_remote_code: true
flash_attn: sdpa
image_max_pixels: 131072
video_max_pixels: 131072
video_fps: 2.0
video_maxlen: 256

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: configs/h200/deepspeed_zero1_dynamic_graph.json

dataset_dir: $DATASET_DIR
dataset: $DATASET_NAME
template: qwen3_vl_nothink
cutoff_len: 16384
packing: false
preprocessing_num_workers: 1
dataloader_num_workers: 2
dataloader_prefetch_factor: 2
dataloader_persistent_workers: true
dataloader_pin_memory: true
data_shared_file_system: true
remove_unused_columns: false

output_dir: $OUTPUT_DIR
logging_steps: 1
save_strategy: "no"
save_total_limit: 1
save_only_model: false
overwrite_output_dir: false
report_to: none
load_best_model_at_end: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
max_steps: 256
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 4
warmup_ratio: 0.0
weight_decay: 0.01
max_grad_norm: 0.0
optim: adamw_torch
bf16: true
tf32: true
gradient_checkpointing: true
use_reentrant_gc: false
ddp_timeout: 180000000
seed: 42
data_seed: 42
resume_from_checkpoint: null

ttt_qwen:
  stage: a5
  a5_adaptation_mode: meta_ttt
  a5_phase: fast_state_warmup
  warmup_bundle: null
  project_config: configs/model_state_ttt_8b.yaml
  dataset_manifest: $SVCBENCH_DATASET_MANIFEST
  initialize_from_a2_checkpoint: $A2_CHECKPOINT
  qwen_outer_trainability:
    mode: frozen
    vision_freeze_first_blocks: 27
    decoder_train_last_layers: 0
    train_vision_patch_embed: false
    train_main_merger: false
    train_deepstack_mergers: false
    train_language_model_norm: false
    train_input_embeddings: false
    train_lm_head: false
  support_prefetch_depth: 2
  support_decode_coalesce: true
  support_materialization: segment_double_buffer
  prepared_episode_max_bytes: 2147483648
  support_visual_batch_size: 1
  query_encoder_reuse: true
  query_frame_sampling: llamafactory_uniform_cap
  query_sample_fps: 2.0
  state_query_visual_mode: recent_chunk
  state_query_max_frames: 16
  answer_query_visual_mode: causal_prefix
  answer_query_max_frames: 256
  query_decode_max_groups: 16
  state_query_cache_mode: inherit
  answer_query_cache_mode: disabled
  query_activation_offload: false
  preprocess_cache_mode: readonly
  preprocess_cache_miss_policy: error
  preprocess_cache_root_env: TTT_PREPROCESS_CACHE_ROOT
  preprocess_cache_max_gb: 200
  preprocess_cache_dtype: float16
  visual_cost_mode: proxy
  runtime_trace_mode: "off"
  runtime_trace_dir: null
  segment_prefetch_depth: 1
  semantic_projector_delta_audit_steps: 0
  a5_parameter_delta_audit_steps: 256
  operator_diagnostics_interval: 8
